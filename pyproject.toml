[project]
name = "bacnet-simulator"
version = "0.1.0"
description = "Simulateur de device BACnet/IP (BACnet/IP device simulator) avec bacpypes3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    "bacpypes3>=0.1.0,<1.0.0",
]

[project.scripts]
bacnet-simulator = "bacnet_simulator.cli:main"
bacnet-simulator-client = "bacnet_simulator.client:main"

[tool.poetry]
packages = [{ include = "bacnet_simulator" }]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
